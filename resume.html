<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Resume - Rohith Pallamreddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        background-color: #0a0a0a;
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
        font-family: 'Inter', sans-serif;
      }

      .resume-section {
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px; /* Reduced from 16px to 8px */
      }

      .section-title {
        font-size: 2em;
        margin-bottom: 15px; /* Removes the default spacing below the text */
        margin-top: 15px;    /* Optional: pulls the title higher up the page as well */
      }

      /* Wider border and updated container */
      .resume-image-container {
        width: 100%;
        max-width: 800px;
        border: 5px solid var(--pink); /* Increased border width */
        border-radius: 12px;
        overflow: hidden;
        background: #1a1a1a;
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        line-height: 0;
      }

      .resume-image {
        width: 100%;
        height: auto;
        display: block;
        /* transition removed to stop image zoom */
      }

      /* Container hover: Scale and Glow remains, but image stays static */
      .resume-image-container:hover {
        transform: scale(1.02);
        box-shadow: 0 0 40px rgba(255, 77, 166, 0.4);
        border-color: var(--soft-pink);
      }

      .download-btn {
        display: inline-block;
        padding: 12px 24px;
        background: var(--pink);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        border-radius: 8px;
        margin-top: 25px;
        transition: all 0.3s ease;
      }

      .download-btn:hover {
        transform: scale(1.08);
        box-shadow: 0 0 15px rgba(255, 77, 166, 0.6),
          0 0 30px rgba(255, 77, 166, 0.4),
          0 0 45px rgba(255, 77, 166, 0.2);
        background: var(--soft-pink);
      }

      .muted {
        color: var(--muted);
        margin-top: 12px;
        text-align: center;
      }

      section {
        opacity: 0;
        transform: translateY(40px) scale(0.98);
        animation: premiumFade 0.9s cubic-bezier(.16, 1, .3, 1) forwards;
      }

      @keyframes premiumFade {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @media (max-width: 768px) {
        .resume-section {
          padding: 20px 12px;
        }
        .resume-image-container {
          border-width: 3px; /* Slightly thinner for mobile but still wider than before */
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <a class="logo" href="index.html">Home</a>
      <div class="nav-links">
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="experience.html">Experience</a>
        <a href="resume.html">Resume</a>
      </div>
    </nav>

    <section class="resume-section">
      <h2 class="section-title">Resume</h2>

      <div class="resume-image-container">
        <img
          src="resume.png"
          alt="Rohith Pallamreddy Resume"
          class="resume-image"
        >
      </div>

      <div style="text-align: center;">
        <a href="resume.pdf" download class="download-btn">Download Resume</a>
        <p class="muted">Last updated: 2026</p>
      </div>
    </section>

    <div class="cursor-highlight" id="cursorHighlight"></div>

    <script>
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) entry.target.classList.add("visible");
        });
      }, { threshold: 0.15 });

      document.querySelectorAll(".fade-in").forEach(el => observer.observe(el));
    </script>

    <script>
      const cursor = document.getElementById("cursorHighlight");
      document.addEventListener("mousemove", (e) => {
        if (!cursor) return;
        cursor.style.left = e.clientX + "px";
        cursor.style.top = e.clientY + "px";
        cursor.style.opacity = "1";
      });
    </script>
  </body>
</html>
