<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Resume - Rohith Pallamreddy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        background-color: #0a0a0a; /* Or whatever your dark hex code is */
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent; /* Bonus: stops the blue flash when clicking links on iPhone */
      }
      .resume-section {
        max-width: 1000px;
        margin: 0 auto;
        padding: 40px 20px; /* Reduced top padding to pull everything up */
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .resume-container {
        width: 100%;
        max-width: 850px;
        /* Use 60% of the screen height on mobile */
        height: 60vh;
        min-height: 450px; /* Safety net so it doesn't get TOO small */
        margin-bottom: 20px;
        border: 2px solid var(--pink);
        border-radius: 12px;
        overflow: hidden;
        background: #1a1a1a;
        /* Safari specific fix: Forces the container to be a 'box' */
        -webkit-overflow-scrolling: touch;
      }

      .resume-preview {
        width: 100%;
        height: 100%;
        display: block;
        /* This prevents the PDF from trying to 'break out' of the box */
        border: none;
      }

      /* Desktop: Make it much taller */
      @media (min-width: 1024px) {
        .resume-container {
          height: 85vh;
        }
      }
      section {
        opacity: 0;
        transform: translateY(40px) scale(0.98);
        animation: premiumFade 0.9s cubic-bezier(.16, 1, .3, 1) forwards;
      }

      @keyframes premiumFade {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .download-btn {
        display: inline-block;
        padding: 12px 24px;
        background: var(--pink);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        border-radius: 8px;
        transition: all 0.3s ease;
      }

      .download-btn:hover {
        transform: scale(1.08);
        box-shadow: 0 0 15px rgba(255, 77, 166, 0.6),
          0 0 30px rgba(255, 77, 166, 0.4),
          0 0 45px rgba(255, 77, 166, 0.2);
        background: var(--soft-pink);
      }

      .muted {
        color: var(--muted);
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <nav>
      <a class="logo" href="index.html">Home</a>
      <div class="nav-links">
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="experience.html">Experience</a>
        <a href="resume.html">Resume</a>
      </div>
    </nav>
    <section class="resume-section">
          <h2 class="section-title">Resume</h2>

          <div class="resume-container">
            <iframe
              src="resume.pdf#toolbar=0&navpanes=0&scrollbar=1&view=FitH"
              class="resume-preview"
              style="border:none;">
            </iframe>
          </div>

          <div style="text-align: center;">
            <a href="resume.pdf" download class="download-btn">Download Resume</a>
            <p class="muted">Last updated: 2026</p>
          </div>
        </section>
    <div class="cursor-highlight" id="cursorHighlight"></div>
    <script>
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
          }
        });
      }, {
        threshold: 0.15
      });
      document.querySelectorAll(".fade-in").forEach(el => observer.observe(el));
    </script>
    <script>
      const cursor = document.getElementById("cursorHighlight");
      document.addEventListener("mousemove", (e) => {
        cursor.style.left = e.clientX + "px";
        cursor.style.top = e.clientY + "px";
        cursor.style.opacity = "1";
      });
    </script>
  </body>
</html>
